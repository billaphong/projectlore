[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "projectlore"
version = "0.1.0a3"
description = "Give every coding agent the same understanding of your project."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "ProjectLore contributors" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "mcp>=1.0,<2",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
]

[project.urls]
Homepage = "https://github.com/billaphong/projectlore"
Documentation = "https://github.com/billaphong/projectlore#readme"
Issues = "https://github.com/billaphong/projectlore/issues"
Source = "https://github.com/billaphong/projectlore"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "hatchling>=1.27,<2",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
lore = "projectlore.cli:main"
projectlore-mcp = "projectlore.mcp_server:main"
projectlore-hook = "projectlore.hook:main"
projectlore-scope-hook = "projectlore.scope_hook:main"
projectlore-acquisition-hook = "projectlore.acquisition_hook:main"
projectlore-acquisition-mcp = "projectlore.acquisition_mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["src/projectlore"]

[tool.hatch.build.targets.wheel.force-include]
"examples/homebrew.project.yaml" = "projectlore/corpus/homebrew.project.yaml"
"examples/homebrew.forecast-trust.project.yaml" = "projectlore/corpus/homebrew.forecast-trust.project.yaml"

[tool.hatch.build.targets.sdist]
include = [
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/README.md",
  "/SECURITY.md",
  "/docs/architecture.md",
  "/docs/agent-onboarding.md",
  "/docs/client-capabilities.json",
  "/docs/compatibility.md",
  "/docs/extension-sdk.md",
  "/docs/getting-started.md",
  "/docs/phase-audit.md",
  "/docs/pilots/homebrew-forecast-trust.md",
  "/docs/pilots/sienna-campaign-authority.md",
  "/docs/product-research-and-plan.md",
  "/docs/release-policy.md",
  "/docs/scale-and-refresh-decision.md",
  "/docs/ui-decision.md",
  "/docs/versioning-and-migrations.md",
  "/examples/contracts/portable.valid.yaml",
  "/examples/homebrew.project.yaml",
  "/examples/homebrew.forecast-trust.project.yaml",
  "/pyproject.toml",
  "/schemas/projectlore.schema.json",
  "/schemas/projectlore-acquisition.schema.json",
  "/src/projectlore",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["projectlore"]
