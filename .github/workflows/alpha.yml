name: alpha

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install development environment
        run: python -m pip install -e ".[dev]"
      - name: Verify source
        run: |
          python -m pytest
          python -m ruff check src tests
          python -m mypy src/projectlore
          python -m projectlore.cli schema schemas/projectlore.schema.json --check
      - name: Build and inspect distributions
        run: |
          python -m build
          python scripts/verify_distribution.py dist
      - name: Fresh offline installation
        run: >-
          python scripts/offline_smoke.py
          dist
          examples/contracts/portable.valid.yaml
          schemas/projectlore.schema.json
      - name: Retain one alpha artifact
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        uses: actions/upload-artifact@v7
        with:
          name: projectlore-0.1.0a1
          path: dist/*
          if-no-files-found: error
