name: publish-pypi

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub prerelease tag to publish
        required: true
        default: v0.1.0a1

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/projectlore/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Resolve authorized release manifest and tag target
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test -f ".github/releases/${RELEASE_TAG}.json"
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          echo "TAG_COMMIT=$(git rev-list -n 1 "${RELEASE_TAG}")" >> "$GITHUB_ENV"
      - name: Download immutable GitHub release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir dist
          gh release download "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --dir dist \
            --pattern "projectlore-*.whl" \
            --pattern "projectlore-*.tar.gz"
      - name: Verify tag, commit, version, filenames, and hashes
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python scripts/verify_release.py \
            ".github/releases/${RELEASE_TAG}.json" \
            dist \
            --tag "${RELEASE_TAG}" \
            --tag-commit "${TAG_COMMIT}"
      - name: Publish identical artifacts to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
